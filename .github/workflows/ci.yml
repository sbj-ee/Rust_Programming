name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors the Makefile targets: `make lint` (fmt + clippy), `make build`, `make test`.
  stable:
    name: fmt, clippy, build, test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test

  # Keeps the `rust-version = "1.75"` promise in Cargo.toml honest.
  msrv:
    name: build (MSRV 1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - name: cargo build
        run: cargo build
